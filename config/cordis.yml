# Self-contained editor profile. The launcher owns this composition so users do
# not need a DeepSeek Harness checkout or a locally edited example file.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max
    apiKeyEnv: DEEPSEEK_API_KEY
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
- id: tool-call-timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

# The shell executor and model-facing tool must use the same dialect. Windows
# selects PowerShell; POSIX hosts select bash. The agent spine's bundled bash
# consumer is disabled below so this deployment owns the platform switch.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"
# The former '@deepseek-ai/dsh-agent-spine-demo' bundle, flattened. Upstream
# deleted that example package at 0.1.2-rc.1, so this deployment now owns the
# same composition explicitly, one published plugin per row. The set and the
# forwarded configuration match what the bundle mounted for this profile's old
# config: `toolBash: false` (this profile owns the platform shell switch, so
# the bundle's bash consumer is simply absent), `goals: {}`, the persona (now
# `personaPrefix`, renamed upstream at 0.1.5), and `workspaceContext.maxBytes`
# now addressed at their owning plugins.
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'
- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: session
  name: '@deepseek-ai/dsh-session'
- id: session-title
  name: '@deepseek-ai/dsh-session-title'
  config:
    fallbackMaxWords: 5
    fallbackMaxBytes: 40
    maxTitleBytes: 80
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: true
    includeRuntimeContext: true
    # 0.1.5 split `persona` into `personaPrefix` and `personaSuffix`; 0.2.2-rc.5
    # removed the `{{cwd}}` prompt variable in favor of `dsh-working-directory`
    # owning the durable `working-directory:current` runtime-context snapshot.
    personaPrefix: 'You are a coding assistant powered by the {{model}} model.'
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: tool-executor-native
  name: '@deepseek-ai/dsh-tool-executor-native'
- id: skill
  name: '@deepseek-ai/dsh-skill'
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: agent
  name: '@deepseek-ai/dsh-agent'
- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'
- id: goal
  name: '@deepseek-ai/dsh-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: goal-round-driver
  name: '@deepseek-ai/dsh-goal-round-driver'
- id: jobs
  name: '@deepseek-ai/dsh-jobs-local'
# Both agent-instructions and tool-skill prepend session-prefix messages, and
# registration order is the rendered order, so workspace instructions must stay
# ahead of the skill catalog.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- id: session-title-provider
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    # A ceiling against runaway output (including reasoning tokens), not a length target.
    maxOutputTokens: 4096
    timeoutMs: 60000
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: commands
  name: '@deepseek-ai/dsh-commands'
- id: command-feedback
  name: '@deepseek-ai/dsh-command-feedback'
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'
- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: |
      Develop a complete implementation plan before changing files. Inspect enough context to make the plan actionable, present it through exit_plan_mode, and wait for explicit approval before implementation.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: permission-presets
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
# Session logs are already partitioned by each session's own cwd beneath the
# root, so the root itself must not follow the process cwd: a client that
# serves several workspaces from one process, or restarts it elsewhere, would
# otherwise lose sight of every session it wrote. The default lives in the dsh
# home beside settings and credentials, in its own directory so ACP sessions
# stay isolated from other Harness surfaces. A blank override counts as unset.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_ACP_SESSIONS_ROOT || dshHomePath('acp-sessions')"
    compression: !!js "process.env.DSH_ACP_SESSION_COMPRESSION ?? 'zstd'"
- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
- id: session-query
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()
- id: working-directory
  name: '@deepseek-ai/dsh-working-directory'
- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    # Set false to drop the apply_patch tool beside edit.
    applyPatch: false
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # Deterministic modification-time head is preferable to sampling in an
    # editor, where the complete formatted result remains available via spill
    # when a deployment composes that optional provider.
    sampleOverCapGlobResults: false
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    fetchProvider: http
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
# In-process delegation. The subagent registry and its spawn/fork backends are
# process singletons; each delegation tool row names one backend. Every call
# starts a managed activation (`delivery: 'parent'`) and returns its child name
# immediately; the host enforces subagent tree quiescence via `waitForTreeWork`
# during turns and `drainDescendants` on cancellation, session close, and
# bridge teardown. Each child inherits the parent's sandbox override with
# approval pinned to `never` at the delegation boundary, and `dsh-user-questions`
# rejects delegated callers (`origin === 'subagent'`) with `DELEGATED_CALLER`
# (while the bridge only answers questions and approvals for its owned root
# agents). Continuable control tools (`dsh-tool-subagent-control`) and
# out-of-process backends stay deferred (see config/editor-profile.json).
- id: subagents
  name: '@deepseek-ai/dsh-subagent'
- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn
- id: subagent-fork
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
# MCP servers are not static profile plugins. The ACP bridge composes the
# published dsh-mcp-client dynamically inside each exact agent/session scope
# from session/new, session/load, or session/resume request configuration.
- id: acp-interactive
  name: '../lib/index.js'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
