# Self-contained editor profile. The launcher owns this composition so users do
# not need a DeepSeek Harness checkout or a locally edited example file.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro
      - id: deepseek-v4-flash-vision-exp
        inputModalities: [text, image]
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
- id: tool-call-timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

# The shell executor and model-facing tool must use the same dialect. Windows
# selects PowerShell; POSIX hosts select bash. The agent spine's bundled bash
# consumer is disabled below so this deployment owns the platform switch.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 60000
- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    toolBash: false
    goals: {}
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.
- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: commands
  name: '@deepseek-ai/dsh-commands'
- id: command-feedback
  name: '@deepseek-ai/dsh-command-feedback'
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'
- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  config:
    section: |
      Develop a complete implementation plan before changing files. Inspect enough context to make the plan actionable, present it through exit_plan_mode, and wait for explicit approval before implementation.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: permission-presets
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_ACP_SESSIONS_ROOT ?? './.sessions'"
    compression: !!js "process.env.DSH_ACP_SESSION_COMPRESSION ?? 'zstd'"
- id: checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
- id: session-query
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()
- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # Deterministic modification-time head is preferable to sampling in an
    # editor, where the complete formatted result remains available via spill
    # when a deployment composes that optional provider.
    sampleOverCapGlobResults: false
- id: acp-interactive
  name: '../lib/index.js'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
