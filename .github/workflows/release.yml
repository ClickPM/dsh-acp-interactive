name: Release

# Triggered by a version tag, or dispatched by hand for an existing tag.
# Verifies the tagged tree, packs the tarball, publishes to npm through
# trusted publishing (OIDC, no long-lived token) when the repository variable
# NPM_TRUSTED_PUBLISHING is "true", and creates or refreshes the GitHub
# Release with the tarball and its checksum.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to (re)publish, e.g. v1.0.4'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  release:
    name: Verify, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Registry entry and icon
        run: node scripts/check-registry-entry.mjs

      - name: Install the packed tarball outside the repository and drive the real launcher
        run: npm run verify:packed

      - name: Pack
        run: |
          npm pack --ignore-scripts
          sha256sum deepseekharness-acp-interactive-*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to npm (trusted publishing)
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "deepseekharness-acp-interactive@$VERSION" version >/dev/null 2>&1; then
            echo "deepseekharness-acp-interactive@$VERSION is already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run (for example after enabling trusted publishing) refreshes
            # the assets instead of failing on the existing Release.
            gh release upload "$TAG" --clobber \
              deepseekharness-acp-interactive-*.tgz SHA256SUMS.txt
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --notes "npm: https://www.npmjs.com/package/deepseekharness-acp-interactive/v/${TAG#v}" \
              deepseekharness-acp-interactive-*.tgz SHA256SUMS.txt
          fi

      # A Release created with GITHUB_TOKEN does not fire `release: published`
      # for other workflows, so dispatch the Registry check explicitly once the
      # version is on npm. After a manual publish, run the same command by hand.
      - name: Re-validate the published package with the Registry's scripts
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run registry-auth.yml --ref "$TAG" -f version="${TAG#v}"
